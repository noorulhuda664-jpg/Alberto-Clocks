<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart - Alberto Clocks</title>

  <link rel="shortcut icon"
    href="images/pngtree-clock-icon-simple-flat-vector-png-image_12244605.png"
    type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f5f5;
    }

    .cart-page {
      padding: 50px 0;
      min-height: 70vh;
    }

    .cart-title {
      text-align: center;
      margin-bottom: 40px;
      font-weight: bold;
    }

    .cart-item {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .cart-item img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 10px;
    }

    .product-name {
      font-weight: bold;
      font-size: 18px;
    }

    .product-price {
      color: #198754;
      font-weight: bold;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-box button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 5px;
      background: #212529;
      color: white;
    }

    .quantity {
      font-weight: bold;
      min-width: 25px;
      text-align: center;
    }

    .remove-btn {
      border: none;
      background: #dc3545;
      color: white;
      padding: 7px 12px;
      border-radius: 5px;
    }

    .cart-summary {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 20px;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      color: #198754;
    }

    .empty-cart {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-cart i {
      font-size: 70px;
      color: #aaa;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .cart-item img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary my-nav">
    <div class="container-fluid">

      <div class="logo-area">
        <a class="navbar-brand" href="index.html">
          <img src="images/pngtree-clock-icon-simple-flat-vector-png-image_12244605.png"
            alt="Alberto Clocks" width="50" height="50">
        </a>
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon">
          <i class="fa-solid fa-bars"></i>
        </span>
      </button>

      <div class="collapse navbar-collapse navbr" id="navbarNavDropdown">

        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="shop.html">Shop</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="cart.html">Cart</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#about">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html#contact">Contact Us</a>
          </li>
        </ul>

        <div class="ms-auto">
          <a href="cart.html" style="color: inherit; text-decoration: none; font-size: 22px;">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount" class="badge bg-danger">0</span>
          </a>
        </div>

      </div>
    </div>
  </nav>


  <!-- Cart -->
  <section class="cart-page">
    <div class="container">

      <h1 class="cart-title">Your Shopping Cart</h1>

      <div class="row">

        <!-- Products -->
        <div class="col-lg-8">
          <div id="cartItems"></div>
        </div>

        <!-- Summary -->
        <div class="col-lg-4">
          <div class="cart-summary">

            <h3>Order Summary</h3>
            <hr>

            <div class="d-flex justify-content-between mb-3">
              <span>Items:</span>
              <span id="totalItems">0</span>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <span>Subtotal:</span>
              <span id="subtotal">Rs. 0</span>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <span>Delivery:</span>
              <span>Free</span>
            </div>

            <hr>

            <div class="d-flex justify-content-between">
              <span><strong>Total:</strong></span>
              <span class="total" id="totalPrice">Rs. 0</span>
            </div>

            <br>

            <button class="btn btn-success w-100" onclick="checkout()">
              <i class="fa-solid fa-credit-card"></i>
              Proceed to Checkout
            </button>

            <br><br>

            <button class="btn btn-outline-danger w-100" onclick="clearCart()">
              <i class="fa-solid fa-trash"></i>
              Clear Cart
            </button>

            <br><br>

            <a href="shop.html" class="btn btn-outline-primary w-100">
              Continue Shopping
            </a>

          </div>
        </div>

      </div>
    </div>
  </section>


  <script>

    // ==========================================
    // HELPERS
    // ==========================================

    // Turns old text prices ("Rs.3,413,000", "Rs.18,000.00", "₨ 87,999")
    // into numbers. Only used to convert carts saved by the old version.
    function parsePriceText(text) {
      const cleaned = String(text)
        .replace(/rs\.?|₨/gi, '')
        .replace(/,/g, '')
        .trim();
      const value = parseFloat(cleaned);
      return isNaN(value) ? 0 : value;
    }

    function formatPrice(price) {
      return "Rs. " + Number(price).toLocaleString("en-PK");
    }

    // Prevents names/paths from breaking the page HTML
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Load cart and convert any old-format items to the new format
    function loadCart() {
      let saved;

      try {
        saved = JSON.parse(localStorage.getItem("cart"));
      } catch (e) {
        saved = [];
      }

      if (!Array.isArray(saved)) {
        saved = [];
      }

      let changed = false;

      const cleanCart = saved.map(product => {

        // Old format: price saved as text
        if (typeof product.price !== "number") {
          product.displayPrice = product.displayPrice || String(product.price);
          product.price = parsePriceText(product.price);
          changed = true;
        }

        if (!product.displayPrice) {
          product.displayPrice = formatPrice(product.price);
          changed = true;
        }

        product.quantity = Math.max(1, parseInt(product.quantity, 10) || 1);

        return product;
      });

      if (changed) {
        localStorage.setItem("cart", JSON.stringify(cleanCart));
      }

      return cleanCart;
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
      displayCart();
    }


    // ==========================================
    // DISPLAY CART
    // ==========================================

    function displayCart() {

      const cart = loadCart();

      const cartItems = document.getElementById("cartItems");
      const totalItems = document.getElementById("totalItems");
      const subtotal = document.getElementById("subtotal");
      const totalPrice = document.getElementById("totalPrice");
      const cartCount = document.getElementById("cartCount");

      let html = "";

      // Empty cart
      if (cart.length === 0) {

        cartItems.innerHTML = `
          <div class="empty-cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <h2>Your cart is empty</h2>
            <p>You haven't added any watches yet.</p>
            <a href="shop.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;

        totalItems.textContent = "0";
        subtotal.textContent = "Rs. 0";
        totalPrice.textContent = "Rs. 0";
        cartCount.textContent = "0";

        return;
      }

      let total = 0;
      let itemCount = 0;

      cart.forEach((product, index) => {

        const productTotal = product.price * product.quantity;

        total += productTotal;
        itemCount += product.quantity;

        html += `
          <div class="cart-item">
            <div class="row align-items-center">

              <div class="col-md-2 col-4">
                <img src="${escapeHtml(product.image)}"
                  alt="${escapeHtml(product.name)}"
                  class="img-fluid">
              </div>

              <div class="col-md-4 col-8">
                <div class="product-name">${escapeHtml(product.name)}</div>
                <div class="product-price">${escapeHtml(product.displayPrice)}</div>
              </div>

              <div class="col-md-3 col-6 mt-3 mt-md-0">
                <div class="quantity-box">
                  <button onclick="changeQuantity(${index}, -1)" aria-label="Decrease quantity">−</button>
                  <span class="quantity">${product.quantity}</span>
                  <button onclick="changeQuantity(${index}, 1)" aria-label="Increase quantity">+</button>
                </div>
              </div>

              <div class="col-md-2 col-4 mt-3 mt-md-0">
                <strong>${formatPrice(productTotal)}</strong>
              </div>

              <div class="col-md-1 col-2 mt-3 mt-md-0">
                <button class="remove-btn" onclick="removeProduct(${index})"
                  aria-label="Remove item">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>

            </div>
          </div>
        `;
      });

      cartItems.innerHTML = html;

      totalItems.textContent = itemCount;
      subtotal.textContent = formatPrice(total);
      totalPrice.textContent = formatPrice(total);
      cartCount.textContent = itemCount;
    }


    // ==========================================
    // CART ACTIONS
    // ==========================================

    // Increase / decrease quantity
    function changeQuantity(index, change) {

      const cart = loadCart();

      if (!cart[index]) {
        return;
      }

      cart[index].quantity += change;

      // Remove product if quantity reaches 0
      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      saveCart(cart);
    }

    // Remove product
    function removeProduct(index) {

      const cart = loadCart();

      cart.splice(index, 1);

      saveCart(cart);
    }

    // Clear entire cart
    function clearCart() {

      const cart = loadCart();

      if (cart.length === 0) {
        return;
      }

      if (confirm("Are you sure you want to clear your cart?")) {
        saveCart([]);
      }
    }

    // Go to checkout
    function checkout() {

      const cart = loadCart();

      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }

      window.location.href = "checkout.html";
    }


    // Load cart when page opens
    displayCart();

    // Refresh if the cart is changed in another tab
    window.addEventListener("storage", function (event) {
      if (event.key === "cart") {
        displayCart();
      }
    });

  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
