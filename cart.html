<body>
    <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart - Alberto Clocks</title>

  <link rel="shortcut icon"
    href="images/pngtree-clock-icon-simple-flat-vector-png-image_12244605.png"
    type="image/x-icon">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f5f5;
    }

    .cart-page {
      padding: 50px 0;
      min-height: 70vh;
    }

    .cart-title {
      text-align: center;
      margin-bottom: 40px;
      font-weight: bold;
    }

    .cart-item {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .cart-item img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      border-radius: 10px;
    }

    .product-name {
      font-weight: bold;
      font-size: 18px;
    }

    .product-price {
      color: #198754;
      font-weight: bold;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-box button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 5px;
      background: #212529;
      color: white;
    }

    .quantity {
      font-weight: bold;
      min-width: 25px;
      text-align: center;
    }

    .remove-btn {
      border: none;
      background: #dc3545;
      color: white;
      padding: 7px 12px;
      border-radius: 5px;
    }

    .cart-summary {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 20px;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
      color: #198754;
    }

    .empty-cart {
      text-align: center;
      padding: 80px 20px;
    }

    .empty-cart i {
      font-size: 70px;
      color: #aaa;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .cart-item img {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary my-nav">

    <div class="container-fluid">

      <div class="logo-area">

        <a class="navbar-brand" href="index.html">
          <img
            src="images/pngtree-clock-icon-simple-flat-vector-png-image_12244605.png"
            alt="Alberto Clocks"
            width="50"
            height="50">
        </a>

      </div>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNavDropdown">

        <span class="navbar-toggler-icon">
          <i class="fa-solid fa-bars"></i>
        </span>

      </button>

      <div class="collapse navbar-collapse navbr"
        id="navbarNavDropdown">

        <ul class="navbar-nav">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="shop.html">
              Shop
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="cart.html">
              Cart
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#about">
              About Us
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="index.html#contact">
              Contact Us
            </a>
          </li>

        </ul>

        <div class="ms-auto">

          <a href="cart.html"
            style="color: inherit; text-decoration: none; font-size: 22px;">

            <i class="fa-solid fa-cart-shopping"></i>

            <span id="cartCount"
              class="badge bg-danger">
              0
            </span>

          </a>

        </div>

      </div>

    </div>

  </nav>


  <!-- Cart -->
  <section class="cart-page">

    <div class="container">

      <h1 class="cart-title">
        Your Shopping Cart
      </h1>

      <div class="row">

        <!-- Products -->
        <div class="col-lg-8">

          <div id="cartItems"></div>

        </div>


        <!-- Summary -->
        <div class="col-lg-4">

          <div class="cart-summary">

            <h3>Order Summary</h3>

            <hr>

            <div class="d-flex justify-content-between mb-3">

              <span>Items:</span>

              <span id="totalItems">
                0
              </span>

            </div>

            <div class="d-flex justify-content-between mb-3">

              <span>Subtotal:</span>

              <span id="subtotal">
                Rs. 0
              </span>

            </div>

            <div class="d-flex justify-content-between mb-3">

              <span>Delivery:</span>

              <span>
                Free
              </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between">

              <span>
                <strong>Total:</strong>
              </span>

              <span class="total"
                id="totalPrice">
                Rs. 0
              </span>

            </div>

            <br>

            <button
              class="btn btn-success w-100"
              onclick="checkout()">

              <i class="fa-solid fa-credit-card"></i>
              Proceed to Checkout

            </button>

            <br><br>

            <button
              class="btn btn-outline-danger w-100"
              onclick="clearCart()">

              <i class="fa-solid fa-trash"></i>
              Clear Cart

            </button>

            <br><br>

            <a href="shop.html"
              class="btn btn-outline-primary w-100">

              Continue Shopping

            </a>

          </div>

        </div>

      </div>

    </div>

  </section>


  <script>

    // Get cart from localStorage
    let cart =
      JSON.parse(localStorage.getItem("cart")) || [];


    // Convert price to number
    function getPrice(price) {

      return Number(
        price
          .replace(/[^0-9.]/g, '')
          .replace(/,/g, '')
      );

    }


    // Format Pakistani currency
    function formatPrice(price) {

      return "Rs. " +
        price.toLocaleString("en-PK");

    }


    // Display cart
    function displayCart() {

      const cartItems =
        document.getElementById("cartItems");

      const totalItems =
        document.getElementById("totalItems");

      const subtotal =
        document.getElementById("subtotal");

      const totalPrice =
        document.getElementById("totalPrice");

      const cartCount =
        document.getElementById("cartCount");


      cartItems.innerHTML = "";


      // Empty cart
      if (cart.length === 0) {

        cartItems.innerHTML = `

          <div class="empty-cart">

            <i class="fa-solid fa-cart-shopping"></i>

            <h2>Your cart is empty</h2>

            <p>
              You haven't added any watches yet.
            </p>

            <a href="shop.html"
              class="btn btn-primary">

              Start Shopping

            </a>

          </div>

        `;

        totalItems.textContent = "0";
        subtotal.textContent = "Rs. 0";
        totalPrice.textContent = "Rs. 0";
        cartCount.textContent = "0";

        return;
      }


      let total = 0;
      let itemCount = 0;


      cart.forEach((product, index) => {

        const price =
          getPrice(product.price);

        const productTotal =
          price * product.quantity;

        total += productTotal;

        itemCount += product.quantity;


        cartItems.innerHTML += `

          <div class="cart-item">

            <div class="row align-items-center">

              <div class="col-md-2 col-4">

                <img
                  src="${product.image}"
                  alt="${product.name}"
                  class="img-fluid">

              </div>


              <div class="col-md-4 col-8">

                <div class="product-name">

                  ${product.name}

                </div>

                <div class="product-price">

                  ${product.price}

                </div>

              </div>


              <div class="col-md-3 col-6 mt-3 mt-md-0">

                <div class="quantity-box">

                  <button
                    onclick="changeQuantity(${index}, -1)">

                    −

                  </button>

                  <span class="quantity">

                    ${product.quantity}

                  </span>

                  <button
                    onclick="changeQuantity(${index}, 1)">

                    +

                  </button>

                </div>

              </div>


              <div class="col-md-2 col-4 mt-3 mt-md-0">

                <strong>

                  ${formatPrice(productTotal)}

                </strong>

              </div>


              <div class="col-md-1 col-2 mt-3 mt-md-0">

                <button
                  class="remove-btn"
                  onclick="removeProduct(${index})">

                  <i class="fa-solid fa-trash"></i>

                </button>

              </div>

            </div>

          </div>

        `;

      });


      totalItems.textContent =
        itemCount;

      subtotal.textContent =
        formatPrice(total);

      totalPrice.textContent =
        formatPrice(total);

      cartCount.textContent =
        itemCount;

    }


    // Increase / decrease quantity
    function changeQuantity(index, change) {

      cart[index].quantity += change;


      // Remove product if quantity reaches 0
      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();

    }


    // Remove product
    function removeProduct(index) {

      cart.splice(index, 1);

      saveCart();

    }


    // Clear entire cart
    function clearCart() {

      if (cart.length === 0) {
        return;
      }


      const confirmation =
        confirm(
          "Are you sure you want to clear your cart?"
        );


      if (confirmation) {

        cart = [];

        saveCart();

      }

    }


    // Save cart
    function saveCart() {

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );

      displayCart();

    }


   function checkout() {

  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  window.location.href = "checkout.html";
}


    // Load cart when page opens
    displayCart();

  </script>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

</body>

</html>
</body>
</html>
